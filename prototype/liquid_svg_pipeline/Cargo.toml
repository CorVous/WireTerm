[package]
name = "wireterm-liquid-svg-prototype"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
image = { version = "=0.25.9", default-features = false, features = ["png"] }
liquid = { version = "=0.26.11", default-features = false }
liquid-lib = { version = "=0.26.11", default-features = false, features = ["stdlib"] }
png = "=0.18.0"
resvg = { version = "=0.47.0", default-features = false, features = ["raster-images", "text"] }
serde_json = "1"
sha2 = "0.10"
tiny-skia = "=0.12.0"
