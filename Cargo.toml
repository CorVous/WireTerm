[package]
name = "wireterm"
version = "0.1.3"
edition = "2024"
rust-version = "1.92"
authors = ["Cassidy Prather <pratherea@gmail.com>"]
description = "Portable Windows host for a wired black/white/red e-paper display"
readme = "README.md"
license = "AGPL-3.0-or-later"
repository = "https://github.com/CorVous/WireTerm"
keywords = ["epaper", "esp32", "serial"]
categories = ["gui"]
publish = false
default-run = "wireterm"

[lib]
name = "wireterm"
path = "src/lib.rs"

[[bin]]
name = "wireterm"
path = "src/main.rs"

[dependencies]
crc32fast = "1"
eframe = "0.34"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
mlua = { version = "0.11", features = ["lua54", "vendored", "serialize"] }
resvg = { version = "0.47", default-features = false, features = ["raster-images", "text"] }
rfd = "0.15"
roxmltree = "0.21"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"
thiserror = "2"

[target.'cfg(target_os = "windows")'.dependencies]
tray-icon = "0.24"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# Turn everything up. I'm not a coward!
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Targeted allows (each one earns its place, like the ruff ignores did)
multiple_crate_versions = "allow" # Transitive deps disagree; not actionable here
missing_errors_doc = "allow" # Undocumented stuff is fine (the D10 of clippy)
missing_panics_doc = "allow" # Ditto

[profile.release]
# Smaller, faster binaries at the cost of compile time
lto = "thin"
strip = "symbols"
